name: Bug report
description: Something in DotCarbon doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first, and do **not** file security
        vulnerabilities here — see [SECURITY.md](https://github.com/DanKaufmanDev/dotcarbon/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
      placeholder: Running `carbon dev` on a fresh Vue project shows a blank window instead of the app.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that reproduces it. A link to a minimal repo is ideal.
      placeholder: |
        1. `npm create @dotcarbon/app my-app --template vue`
        2. `cd my-app && carbon dev`
        3. …
    validations:
      required: true
  - type: textarea
    id: carbon-info
    attributes:
      label: Environment (`carbon info`)
      description: Paste the full output of `carbon info` run in your project. This captures your exact toolchain.
      render: text
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform(s)
      multiple: true
      options: [macOS, Windows, Linux, Android, iOS]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Console output, stack traces, or build errors. Automatically formatted as code.
      render: shell
