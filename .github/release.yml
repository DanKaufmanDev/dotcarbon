# Configures GitHub's auto-generated release notes (Releases → Generate release notes).
# PRs are grouped by label; label your PR so it lands in the right section.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: ⚡ Features
      labels: [feature, enhancement]
    - title: 🐛 Fixes
      labels: [fix, bug]
    - title: 🔒 Security
      labels: [security]
    - title: 🚀 Performance
      labels: [performance]
    - title: 📖 Documentation
      labels: [docs]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: 🧹 Other changes
      labels: ["*"]
